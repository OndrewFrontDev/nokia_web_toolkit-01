<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.05">
    <title>Discord iframe</title>
    <link rel="stylesheet" href="discordstyle.css">
</head>
<body>
    <main>      
        <div class="btn"><a href="./navigation.html">Domov</a> 
        </div>    
    </main>
</body>

<!-- <script type="module" src="https://unpkg.com/x-frame-bypass"></script> -->
<script>
    window.onload = async() => {
        await import("https://unpkg.com/x-frame-bypass");
        const iframe = document.createElement("iframe");
        iframe.src = "https://discord.com/login";
        
        const main = document.querySelector("main");
        main.append(iframe);
    }
</script>
</html>
